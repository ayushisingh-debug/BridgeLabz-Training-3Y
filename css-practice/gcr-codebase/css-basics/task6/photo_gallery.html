<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Photo Gallery</title>

    <!-- Link CSS file -->
    <link rel="stylesheet" href="gallery.css">
</head>

<body>

    <h1>My Photo Gallery</h1>

    <div class="gallery">

        <!-- Image 1 -->
        <div class="photo">
            <img src="image1.jpg" alt="Mountain">
            <div class="caption">Beautiful Mountains</div>
        </div>

        <!-- Image 2 -->
        <div class="photo">
            <img src="image2.jpg" alt="Beach">
            <div class="caption">Sunny Beach</div>
        </div>

        <!-- Image 3 -->
        <div class="photo">
            <img src="image3.jpg" alt="Forest">
            <div class="caption">Green Forest</div>
        </div>

        <!-- Image 4 -->
        <div class="photo">
            <img src="image4.jpg" alt="City">
            <div class="caption">Beautiful City</div>
        </div>

        <!-- Image 5 -->
        <div class="photo">
            <img src="image5.jpg" alt="Sunset">
            <div class="caption">Amazing Sunset</div>
        </div>

        <!-- Image 6 -->
        <div class="photo">
            <img src="image6.jpg" alt="Lake">
            <div class="caption">Peaceful Lake</div>
        </div>

    </div>

</body>

</html>
