<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard</title>

    <!-- Link CSS file -->
    <link rel="stylesheet" href="dashboard.css">
</head>

<body>

    <!-- Fixed Header -->
    <header>
        <h1>My Dashboard</h1>
    </header>

    <!-- Dashboard Layout -->
    <div class="dashboard">

        <!-- Sidebar -->
        <aside>
            <h2>Menu</h2>

            <nav>
                <a href="#">Home</a>
                <a href="#">Profile</a>
                <a href="#">Projects</a>
                <a href="#">Settings</a>
                <a href="#">Logout</a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main>

            <h2>Dashboard Overview</h2>

            <div class="content-boxes">

                <!-- Content Box 1 -->
                <div class="box">
                    <h3>My Projects</h3>
                    <p>
                        You have completed 5 projects this month.
                    </p>
                </div>

                <!-- Content Box 2 -->
                <div class="box">
                    <h3>Recent Activity</h3>
                    <p>
                        You recently updated your portfolio website.
                    </p>
                </div>

            </div>

        </main>

    </div>

</body>

</html>
