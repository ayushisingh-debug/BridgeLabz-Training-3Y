<!DOCTYPE html>
<html>
<head>
    <title>Travel Selection Page</title>
</head>

<body>

    <h1>Travel Selection Page</h1>

    <!-- Country -->
    <label for="country">Select Country:</label>

    <select id="country">
        <option value="india" selected>India</option>
        <option value="usa">USA</option>
        <option value="japan">Japan</option>
        <option value="france">France</option>
    </select>

    <br><br>

    <!-- State -->
    <label for="state">Select State:</label>

    <select id="state">
        <option value="uttar-pradesh" selected>Uttar Pradesh</option>
        <option value="delhi">Delhi</option>
        <option value="rajasthan">Rajasthan</option>
        <option value="maharashtra">Maharashtra</option>
    </select>

    <br><br>

    <!-- City -->
    <label for="city">Select City:</label>

    <select id="city">
        <option value="mathura" selected>Mathura</option>
        <option value="agra">Agra</option>
        <option value="jaipur">Jaipur</option>
        <option value="varanasi">Varanasi</option>
    </select>

    <br><br>

    <!-- Favorite Tourist Place -->
    <label for="place">Favorite Tourist Place:</label>

    <select id="place">
        <option value="taj-mahal" selected>Taj Mahal</option>
        <option value="eiffel-tower">Eiffel Tower</option>
        <option value="fuji">Mount Fuji</option>
        <option value="gateway">Gateway of India</option>
    </select>

    <br><br>

    <!-- Summary -->
    <p>
        My selected country is <strong>India</strong>,
        state is <strong>Uttar Pradesh</strong>,
        city is <strong>Mathura</strong>,
        and my favorite tourist place is the <strong>Taj Mahal</strong>.
    </p>

</body>
</html>
