<!DOCTYPE html>
<html>
<head>
    <title>File Upload Form</title>
</head>

<body>

    <h1>File Upload Form</h1>

    <form>

        <label>Select a file:</label>
        <input type="file" name="file" accept=".jpg, .png">

        <br><br>

        <p>Only JPG and PNG image files are allowed.</p>

        <input type="submit" value="Upload">

    </form>

</body>
</html>
