<!DOCTYPE html>
<html>
<head>
    <title>Form Submission</title>
</head>

<body>

    <h1>Simple Form</h1>

    <form onsubmit="document.getElementById('result').srcdoc='<h2>Form successfully submitted.</h2>'; return false;">

        <label>Enter Name:</label>
        <input type="text" name="name" required>

        <br><br>

        <input type="submit" value="Submit">

    </form>

    <br>

    <iframe
        id="result"
        width="60%"
        height="150"
        title="Result">
    </iframe>

</body>
</html>
