<!DOCTYPE html>
<html>
<head>
    <title>Google Map</title>
</head>

<body>

    <h1>My City - Mathura</h1>

    <!-- loading="lazy" loads the map only when it is needed, helping the page load faster. -->
    <iframe
        src="https://www.google.com/maps?q=Mathura%2C%20Uttar%20Pradesh&output=embed"
        title="Google Map showing Mathura"
        width="600"
        height="450"
        loading="lazy">
    </iframe>

</body>
</html>
