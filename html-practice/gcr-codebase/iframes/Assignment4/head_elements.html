<!DOCTYPE html>
<html>
<head>

    <!-- title: Sets the title shown on the browser tab -->
    <title>Important Head Elements</title>

    <!-- meta charset: Defines the character encoding of the webpage -->
    <meta charset="UTF-8">

    <!-- meta description: Provides a short description of the webpage -->
    <meta name="description" content="A webpage demonstrating important HTML head elements.">

    <!-- meta author: Specifies the author of the webpage -->
    <meta name="author" content="Ayushi Singh">

    <!-- base: Sets the base URL for all relative links on the webpage -->
    <base href="https://example.com/">

    <!-- link: Connects the webpage to an external resource such as a favicon -->
    <link rel="icon" href="favicon.ico">

    <!-- style: Used to add CSS styles to the webpage -->
    <style>
    </style>

    <!-- script: Used to add JavaScript to the webpage -->
    <script>
    </script>

</head>

<body>

    <h1>Important HTML Head Elements</h1>

    <p>
        This page demonstrates the important elements used inside the
        HTML &lt;head&gt; section.
    </p>

</body>
</html>
